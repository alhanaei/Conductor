# Project-owned template. Copy to .github/workflows/pr-policy.yml.
# Checks that a pull request names exactly one task it closes and that the task is open and
# Ready: it carries exactly one priority (neither the owner-blocked marker nor the tracking
# label), exactly one category and the owner's readiness label. When the task is a sub-issue,
# its parent record is read too and must be open with one category and a priority, the
# owner-blocked marker or the tracking label; only the API's HTTP 404 means "no parent", any
# other lookup failure fails the check. The head commit must belong to this pull request
# alone: a second open pull request at the same head fails the check on both, because
# GitHub attaches check runs to commits and one green run would let either merge. The
# checker is tested by tests/test_pr_policy.py,
# which executes this very script with the gh calls replaced. Label names come from
# repository variables so the project's own scale applies:
#   CONDUCTOR_PRIORITY_LABELS   comma-separated, default "P0,P1,P2,P3"
#   CONDUCTOR_BLOCKED_LABEL     default "blocked:owner"
#   CONDUCTOR_CATEGORY_PREFIX   default "kind:"
#   CONDUCTOR_TRACKING_LABEL    default "kind:tracking" (exempt from priority and readiness)
#   CONDUCTOR_READY_LABEL       default "status:ready" (the owner gate Ready, applied with
#                               a comment naming the approval; required on the task a
#                               pull request closes or references)
#   CONDUCTOR_RECORD_PATHS      comma-separated path prefixes, default
#                               "docs/adr/,.conductor/HANDOFF.md"; a pull request whose
#                               changed files all match may reference its task with
#                               "Refs #n" instead of closing one
#   CONDUCTOR_APPROVAL_MODE     "manual" (default) or "auto" (ADR 0005), the project's
#                               `Approval mode` fact. In auto, a sub-issue's parent must
#                               carry the readiness label too (the owner readied the parent
#                               once; the children inherit), and the pull request must target
#                               the integration branch unless it promotes that branch into
#                               the default branch
#   CONDUCTOR_INTEGRATION_BRANCH
#                               the branch task pull requests land on; default the
#                               repository's default branch
#   CONDUCTOR_REVIEW_REQUIRED_LABEL
#                               default "review:required" (ADR 0007). When the task a pull
#                               request closes carries it, the check fails until the body's
#                               "## Review" section has a line
#                               "Reviewer: <runtime or login>, reviewed SHA: <40-hex>"
#                               whose SHA is the pull request head; a new push turns it red
#                               again until the line is updated
#   CONDUCTOR_ASSISTANT_PRIORITY_CAP
#                               default unset (no cap). In auto (ADR 0008), the highest
#                               priority an assistant may ready: a closed task whose priority
#                               comes before the cap in CONDUCTOR_PRIORITY_LABELS must have
#                               had its readiness label applied by the owner
#   CONDUCTOR_OWNER_CATEGORIES  comma-separated category labels, default unset (none). In
#                               auto, a closed task carrying one of them must have had its
#                               readiness label applied by the owner
#   CONDUCTOR_OWNER_LOGIN       default the repository owner: the login whose `labeled`
#                               event on the issue timeline counts as the owner's Ready.
#                               With neither threshold set the timeline is never read and
#                               the check behaves as before ADR 0008
name: PR policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  linked-task:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PRIORITY_LABELS: ${{ vars.CONDUCTOR_PRIORITY_LABELS || 'P0,P1,P2,P3' }}
      BLOCKED_LABEL: ${{ vars.CONDUCTOR_BLOCKED_LABEL || 'blocked:owner' }}
      CATEGORY_PREFIX: ${{ vars.CONDUCTOR_CATEGORY_PREFIX || 'kind:' }}
      TRACKING_LABEL: ${{ vars.CONDUCTOR_TRACKING_LABEL || 'kind:tracking' }}
      READY_LABEL: ${{ vars.CONDUCTOR_READY_LABEL || 'status:ready' }}
      RECORD_PATHS: ${{ vars.CONDUCTOR_RECORD_PATHS || 'docs/adr/,.conductor/HANDOFF.md' }}
      APPROVAL_MODE: ${{ vars.CONDUCTOR_APPROVAL_MODE || 'manual' }}
      INTEGRATION_BRANCH: ${{ vars.CONDUCTOR_INTEGRATION_BRANCH || github.event.repository.default_branch }}
      REVIEW_REQUIRED_LABEL: ${{ vars.CONDUCTOR_REVIEW_REQUIRED_LABEL || 'review:required' }}
      PRIORITY_CAP: ${{ vars.CONDUCTOR_ASSISTANT_PRIORITY_CAP }}
      OWNER_CATEGORIES: ${{ vars.CONDUCTOR_OWNER_CATEGORIES }}
      OWNER_LOGIN: ${{ vars.CONDUCTOR_OWNER_LOGIN || github.repository_owner }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Require a linked Ready task with one priority and one category
        shell: python
        run: |
          import json, os, re, subprocess, sys

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout

          repo = os.environ["GITHUB_REPOSITORY"]
          mode = os.environ["APPROVAL_MODE"].strip().lower()
          if mode not in ("manual", "auto"):
              print(f"::error::CONDUCTOR_APPROVAL_MODE must be 'manual' or 'auto', not {mode!r}")
              sys.exit(1)
          integration, default_branch = os.environ["INTEGRATION_BRANCH"], os.environ["DEFAULT_BRANCH"]
          base_ref, head_ref = os.environ["BASE_REF"], os.environ["HEAD_REF"]
          if mode == "auto":
              promotion = head_ref == integration and base_ref == default_branch and integration != default_branch
              if base_ref != integration and not promotion:
                  print(f"::error::Approval mode auto: pull requests target the integration branch '{integration}', not '{base_ref}'; only the promotion of '{integration}' into '{default_branch}' may target the default branch.")
                  sys.exit(1)
              print(f"Approval mode auto: base '{base_ref}' accepted" + (" (promotion)" if promotion else "") + ".")
          # One branch, one head, one pull request. GitHub attaches check runs to commits, so a
          # second open pull request at the same head commit would let its green run satisfy
          # branch protection for this one (seen on #89 and #91).
          pr_number, head_sha = os.environ["PR_NUMBER"], os.environ["HEAD_SHA"].lower()
          run = subprocess.run(["gh", "api", f"repos/{repo}/commits/{head_sha}/pulls"], capture_output=True, text=True)
          if run.returncode:
              detail = run.stderr.strip() or run.stdout.strip() or "no output"
              print(f"::error::Could not list the pull requests at head {head_sha} (gh api exit {run.returncode}): {detail}. Check that the workflow token has pull-requests: read and that api.github.com is reachable, then re-run the check.")
              sys.exit(1)
          others = sorted(p["number"] for p in json.loads(run.stdout)
                          if p.get("state") == "open" and str(p["number"]) != pr_number and (p.get("head") or {}).get("sha", "").lower() == head_sha)
          if others:
              print(f"::error::Head {head_sha} is also the head of open pull request {', '.join('#' + str(n) for n in others)}; one branch, one head, one pull request: close the other pull request or push a distinct commit, since a green check on a shared commit would let either pull request merge.")
              sys.exit(1)
          print(f"Head {head_sha} belongs to this pull request alone.")
          body = json.loads(gh("pr", "view", os.environ["PR_NUMBER"], "--repo", repo, "--json", "body"))["body"] or ""
          numbers = sorted({int(n) for n in re.findall(r"\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)", body, re.I)})
          closing = True  # False on the record-only "Refs #n" path, which only references its record
          record_paths = [p.strip() for p in os.environ["RECORD_PATHS"].split(",") if p.strip()]
          if not numbers and record_paths:
              files = [f["path"] for f in json.loads(gh("pr", "view", os.environ["PR_NUMBER"], "--repo", repo, "--json", "files"))["files"]]
              record_only = bool(files) and all(any(f == p or f.startswith(p) for p in record_paths) for f in files)
              if record_only:
                  numbers = sorted({int(n) for n in re.findall(r"\brefs?\s+#(\d+)", body, re.I)})
                  if numbers:
                      closing = False
                      print(f"Record-only pull request ({', '.join(files)}): accepting the referenced task.")
          if not numbers:
              print("::error::The pull request body must name the task it closes, for example 'Closes #42'; a pull request that changes only record paths may reference its task with 'Refs #42'.")
              sys.exit(1)
          if len(numbers) > 1:
              print(f"::error::The pull request names {len(numbers)} distinct tasks (#{', #'.join(map(str, numbers))}); one branch and one pull request close exactly one task. Split the pull request or drop the extra reference.")
              sys.exit(1)
          priorities = [p.strip() for p in os.environ["PRIORITY_LABELS"].split(",") if p.strip()]
          blocked, prefix = os.environ["BLOCKED_LABEL"], os.environ["CATEGORY_PREFIX"]
          tracking, ready = os.environ["TRACKING_LABEL"], os.environ["READY_LABEL"]
          review_required = os.environ["REVIEW_REQUIRED_LABEL"]
          # Thresholds in auto (ADR 0008): a task above the assistant priority cap or in an
          # owner-only category must have been readied by the owner. Both default to unset,
          # and then the timeline is never read.
          priority_cap = os.environ.get("PRIORITY_CAP", "").strip()
          owner_categories = [c.strip() for c in os.environ.get("OWNER_CATEGORIES", "").split(",") if c.strip()]
          owner_login = os.environ.get("OWNER_LOGIN", "").strip()
          thresholds = mode == "auto" and bool(priority_cap or owner_categories)
          if priority_cap and priority_cap not in priorities:
              print(f"::error::CONDUCTOR_ASSISTANT_PRIORITY_CAP must be one of the priority labels ({', '.join(priorities)}), not {priority_cap!r}")
              sys.exit(1)
          if thresholds and not owner_login:
              print("::error::CONDUCTOR_OWNER_LOGIN is empty; the thresholds need the owner's login to compare the readiness label's actor against")
              sys.exit(1)

          def threshold_reasons(labels):
              # Why the task's Ready is the owner's: its priority is before the cap, or its
              # category is owner-only. Empty when the thresholds do not apply to it.
              reasons = []
              if priority_cap:
                  above = [p for p in labels if p in priorities and priorities.index(p) < priorities.index(priority_cap)]
                  if above:
                      reasons.append(f"priority {above[0]} is above the assistant cap {priority_cap}")
              listed = [label for label in labels if label in owner_categories]
              if listed:
                  reasons.append(f"category {listed[0]} is owner-only")
              return reasons

          def ready_actor(number):
              # The login that applied the readiness label last, from the issue timeline. Any
              # failure, or no such event, fails the check: it never passes by default.
              run = subprocess.run(["gh", "api", "--paginate", "--slurp", f"repos/{repo}/issues/{number}/timeline"], capture_output=True, text=True)
              if run.returncode:
                  detail = run.stderr.strip() or run.stdout.strip() or "no output"
                  print(f"::error::Could not read the timeline of task #{number} (gh api exit {run.returncode}): {detail}. Check that the workflow token has issues: read and that api.github.com is reachable, then re-run the check.")
                  sys.exit(1)
              events = [event for page in json.loads(run.stdout) for event in page]
              labelled = [event for event in events if event.get("event") == "labeled" and (event.get("label") or {}).get("name") == ready]
              if not labelled:
                  print(f"::error::The timeline of task #{number} has no 'labeled' event for '{ready}'; the readiness label must be applied on the issue, not inherited or imported, for the owner's Ready to be checked.")
                  sys.exit(1)
              return ((labelled[-1].get("actor") or {}).get("login") or "").strip()

          def review_problem():
              # The "## Review" section of the body, up to the next heading, must name the head.
              section = re.search(r"^##\s+Review\s*$(.*?)(?=^##\s|\Z)", body, re.M | re.S)
              lines = re.findall(r"^\s*(?:[-*]\s*)?Reviewer:\s*(.+?),\s*reviewed SHA:\s*([0-9a-fA-F]{40})\s*$", section.group(1) if section else "", re.M)
              if not lines:
                  return "no 'Reviewer: <runtime or login>, reviewed SHA: <40-hex>' line under '## Review' in the pull request body"
              reviewers = [who.strip() for who, sha in lines if sha.lower() == head_sha]
              if not reviewers:
                  return f"the Review line names SHA {lines[-1][1]}, not the head {head_sha}; review the head and update the line"
              print(f"Review of head {head_sha} recorded by {', '.join(reviewers)}.")
              return None

          def labels_of(number):
              issue = json.loads(gh("issue", "view", str(number), "--repo", repo, "--json", "labels,state"))
              return [label["name"] for label in issue["labels"]], issue["state"]

          def label_problems(labels, closing_task=False):
              # A parent or a referenced record may be owner-blocked or tracking; the task a pull
              # request closes must be a runnable record with exactly one priority.
              priority_count = sum(label in priorities for label in labels)
              categories = [label for label in labels if label.startswith(prefix)]
              problems = []
              if priority_count > 1:
                  problems.append("more than one priority label")
              if closing_task and blocked in labels:
                  problems.append(f"carries '{blocked}'; no pull request closes an owner-blocked record")
              if closing_task and tracking in labels:
                  problems.append(f"carries '{tracking}'; a pull request closes a sub-issue, not the tracking parent")
              if priority_count == 0 and blocked not in labels and tracking not in labels:
                  problems.append("no priority label" if closing_task else "no priority label and no owner-blocked marker")
              if len(categories) != 1:
                  problems.append(f"expected exactly one '{prefix}' label, found {len(categories)}")
              return problems

          def parent_of(number):
              # Sub-issues API: HTTP 404 is the documented "no parent" answer. Any other failure
              # (permission, server, transport) fails the check instead of passing as "no parent".
              run = subprocess.run(["gh", "api", f"repos/{repo}/issues/{number}/parent"], capture_output=True, text=True)
              if run.returncode == 0:
                  return json.loads(run.stdout).get("number")
              if re.search(r"\bHTTP 404\b", run.stderr):
                  return None
              detail = run.stderr.strip() or run.stdout.strip() or "no output"
              print(f"::error::Could not read the parent of task #{number} (gh api exit {run.returncode}): {detail}. Only HTTP 404 means 'no parent'; check that the workflow token has issues: read and that api.github.com is reachable, then re-run the check.")
              sys.exit(1)

          failed = False
          for number in numbers:
              labels, state = labels_of(number)
              problems = label_problems(labels, closing_task=closing)
              if closing and state.upper() != "OPEN":
                  problems.append(f"task is {state.lower()}; a pull request closes an open task")
              if ready not in labels and (closing or tracking not in labels):
                  problems.append(f"missing the '{ready}' label (owner gate Ready)")
              if review_required in labels:
                  problem = review_problem()
                  if problem:
                      failed = True
                      print(f"::error::Task #{number} carries '{review_required}' and the pull request records no review of its head: {problem}")
              reasons = threshold_reasons(labels) if thresholds and closing and not problems else []
              if reasons:
                  actor = ready_actor(number)
                  if actor.lower() != owner_login.lower():
                      failed = True
                      print(f"::error::Task #{number} must be readied by the owner ({owner_login}): " + "; ".join(reasons) + f", and '{ready}' was last applied by {actor or 'an unknown actor'}. Only the owner readies a sub-issue above the cap or in an owner-only category (ADR 0008).")
                  else:
                      print(f"Task #{number} is above the assistant thresholds (" + "; ".join(reasons) + f") and was readied by the owner {actor}.")
              if problems:
                  failed = True
                  print(f"::error::Task #{number} is not ready: " + "; ".join(problems) + f" (labels: {', '.join(labels) or 'none'})")
              else:
                  print(f"Task #{number} is ready: labels {', '.join(labels)}")
              parent = parent_of(number)
              if parent is None:
                  continue
              parent_labels, parent_state = labels_of(parent)
              parent_problems = label_problems(parent_labels)
              if parent_state.upper() != "OPEN":
                  parent_problems.append("parent is closed")
              if mode == "auto" and ready not in parent_labels:
                  parent_problems.append(f"missing the '{ready}' label; in approval mode auto a sub-issue inherits readiness only from a readied parent")
              if parent_problems:
                  failed = True
                  print(f"::error::Parent #{parent} of task #{number} is not a workable record: " + "; ".join(parent_problems) + f" (labels: {', '.join(parent_labels) or 'none'})")
              else:
                  print(f"Parent #{parent} of task #{number} is open: labels {', '.join(parent_labels)}")
          sys.exit(1 if failed else 0)
