# Project-owned template. Copy to .github/workflows/backlog-review.yml.
# A read-and-report reconciliation of open tasks, written to the job summary and, when
# CONDUCTOR_BACKLOG_REVIEW_ISSUE names an existing issue number, posted there as a comment.
# It never creates issues or changes labels; proposals follow the backlog workflow.
# Repository variables (all optional):
#   CONDUCTOR_PRIORITY_LABELS   comma-separated highest first, default "P0,P1,P2,P3"
#   CONDUCTOR_BLOCKED_LABEL     default "blocked:owner"
#   CONDUCTOR_CATEGORY_PREFIX   default "kind:"
#   CONDUCTOR_TRACKING_LABEL    default "kind:tracking"
#   CONDUCTOR_STALE_DAYS        default "7"
#   CONDUCTOR_BACKLOG_REVIEW_ISSUE  issue number to comment on; unset means summary only
name: Backlog reconciliation
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PRIORITY_LABELS: ${{ vars.CONDUCTOR_PRIORITY_LABELS || 'P0,P1,P2,P3' }}
      BLOCKED_LABEL: ${{ vars.CONDUCTOR_BLOCKED_LABEL || 'blocked:owner' }}
      CATEGORY_PREFIX: ${{ vars.CONDUCTOR_CATEGORY_PREFIX || 'kind:' }}
      TRACKING_LABEL: ${{ vars.CONDUCTOR_TRACKING_LABEL || 'kind:tracking' }}
      STALE_DAYS: ${{ vars.CONDUCTOR_STALE_DAYS || '7' }}
      REVIEW_ISSUE: ${{ vars.CONDUCTOR_BACKLOG_REVIEW_ISSUE }}
    steps:
      - name: Build the reconciliation report
        shell: python
        run: |
          import datetime, json, os, subprocess

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout

          repo = os.environ["GITHUB_REPOSITORY"]
          priorities = [p.strip() for p in os.environ["PRIORITY_LABELS"].split(",") if p.strip()]
          blocked, prefix, tracking = os.environ["BLOCKED_LABEL"], os.environ["CATEGORY_PREFIX"], os.environ["TRACKING_LABEL"]
          stale_after = datetime.timedelta(days=int(os.environ["STALE_DAYS"]))
          now = datetime.datetime.now(datetime.timezone.utc)
          issues = json.loads(gh("issue", "list", "--repo", repo, "--state", "open", "--limit", "500",
                                 "--json", "number,title,labels,assignees,updatedAt,createdAt"))
          def labels(issue):
              return [label["name"] for label in issue["labels"]]
          def ref(issue):
              return f"#{issue['number']} {issue['title']}"
          def updated(issue):
              return datetime.datetime.fromisoformat(issue["updatedAt"].replace("Z", "+00:00"))

          missing, untouched, blocked_list, tracking_list, stale_owner = [], [], [], [], []
          by_priority = {p: [] for p in priorities}
          for issue in issues:
              names = labels(issue)
              is_tracking = tracking in names
              found = [p for p in priorities if p in names]
              categories = [name for name in names if name.startswith(prefix)]
              if (not found and blocked not in names and not is_tracking) or len(categories) != 1:
                  missing.append(ref(issue))
              for p in found:
                  by_priority[p].append(issue)
              if found and now - updated(issue) > stale_after:
                  untouched.append(f"{found[0]} {ref(issue)} (last update {updated(issue).date()})")
              if blocked in names:
                  blocked_list.append(ref(issue))
              if is_tracking:
                  tracking_list.append(ref(issue))
              if issue["assignees"] and now - updated(issue) > 2 * stale_after:
                  stale_owner.append(f"{ref(issue)} assigned to {', '.join(a['login'] for a in issue['assignees'])}")
          highest = next((p for p in priorities if by_priority[p]), None)

          lines = [f"# Backlog reconciliation {now.date()}", "",
                   f"Open tasks: {len(issues)}. Highest open priority: {highest or 'none'}"
                   + (f" ({len(by_priority[highest])} tasks)" if highest else "") + ".", ""]
          def section(title, items):
              lines.extend([f"## {title}", ""] + ([f"- {item}" for item in items] or ["- none"]) + [""])
          section("Highest open priority, oldest first", [ref(i) for i in sorted(by_priority[highest], key=lambda i: i["createdAt"])] if highest else [])
          section("Without a priority or category (not ready)", missing)
          section(f"Priority untouched for more than {stale_after.days} days", untouched)
          section("Owner-blocked: confirm the blocker still holds", blocked_list)
          section("Tracking records: confirm open children remain", tracking_list)
          section(f"Assigned but silent for more than {2 * stale_after.days} days (stale or unknown, not proof of abandonment)", stale_owner)
          lines.append("Proposals arising from this report follow the backlog workflow: propose, wait for approval, then file.")
          report = "\n".join(lines)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(report + "\n")
          review_issue = os.environ.get("REVIEW_ISSUE", "").strip()
          if review_issue:
              subprocess.run(["gh", "issue", "comment", review_issue, "--repo", repo, "--body", report], check=True)
          print(report)
