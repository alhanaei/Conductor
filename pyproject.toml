[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor"
version = "0.1.0"
description = "Local-first, tmux-visible, artifact-driven control plane for coding-agent CLIs (Phase 1 kernel: state, tracks, message bus, locks)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Ahmed Alhanaei" }]
# Phase 1 is intentionally dependency-light: stdlib only at runtime.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
conductor = "conductor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines in rendered templates/docstrings are acceptable
    "UP006", "UP007", "UP035", "UP045",  # keep typing.List/Optional style for py39 floor
]
